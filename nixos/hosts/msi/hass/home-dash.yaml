  - type: sections
    max_columns: 2
    title: Termostato
    path: termostato
    icon: mdi:thermostat
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Stanze
            heading_style: title
            icon: mdi:texture-box
          - type: thermostat
            entity: climate.termostato_soggiorno
            show_current_as_primary: true
          - type: thermostat
            entity: climate.termostato_bagno
            show_current_as_primary: true
        column_span: 1
      - type: grid
        cards:
          - type: heading
            heading: Camere
            heading_style: title
            icon: mdi:bed-king
          - type: thermostat
            entity: climate.termostato_matrimoniale
            show_current_as_primary: true
          - type: thermostat
            entity: climate.termostato_cameretta
            show_current_as_primary: true
    header:
      card:
        type: markdown
        content: '# Controllo Termostato'
    cards: []
  - type: sections
    max_columns: 2
    icon: mdi:gauge
    path: ''
    visible:
      - user: d35ec065e1c14502924b0822b389c5c3
    sections:
      - type: grid
        cards:
          - type: heading
            icon: mdi:memory
            heading: Processor
            heading_style: title
          - type: tile
            entity: binary_sensor.display_local
            features_position: bottom
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            name: Display
          - type: tile
            entity: sensor.system_monitor_ipv4_address_enu1u1
            features_position: bottom
            vertical: false
            grid_options:
              columns: 6
              rows: 1
            name: enu1u1
          - chart_type: line
            period: 5minute
            type: statistics-graph
            entities:
              - sensor.system_monitor_load_1_min
              - sensor.system_monitor_processor_use
            stat_types:
              - mean
              - max
              - min
            title: CPU Load
            logarithmic_scale: false
            hide_legend: false
          - graph: line
            type: sensor
            entity: sensor.system_monitor_processor_temperature
            detail: 2
            name: CPU Temperature
            grid_options:
              columns: 12
              rows: 2
      - type: grid
        cards:
          - type: heading
            icon: mdi:sd
            heading: Memory
            heading_style: title
          - chart_type: line
            period: 5minute
            type: statistics-graph
            entities:
              - sensor.system_monitor_memory_use
              - sensor.system_monitor_swap_use
            stat_types:
              - mean
              - max
              - min
            title: RAM
          - type: gauge
            entity: sensor.system_monitor_memory_usage
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
            name: RAM Usage
            grid_options:
              columns: 6
              rows: auto
          - type: gauge
            entity: sensor.system_monitor_swap_usage
            name: Swap Usage
            needle: true
            severity:
              green: 0
              yellow: 40
              red: 80
            grid_options:
              columns: 6
              rows: auto
    header:
      card:
        type: markdown
        content: '# System Status'
    badges: []
    cards: []
  - type: sections
    max_columns: 2
    title: Devices
    path: devices
    icon: mdi:devices
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Availability
            heading_style: title
            icon: mdi:link-variant
          - type: history-graph
            entities:
              - entity: binary_sensor.quiss_server_local
              - entity: binary_sensor.msi_host_local
              - entity: binary_sensor.display_local
            title: History
            logarithmic_scale: false
      - type: grid
        cards:
          - type: heading
            heading: Wake
            heading_style: title
            icon: mdi:lightning-bolt
          - show_name: true
            show_icon: true
            type: button
            entity: switch.quiss
            show_state: false
            icon: mdi:gesture-tap-button
          - show_name: true
            show_icon: true
            type: button
            entity: switch.msi
            icon: mdi:gesture-tap-button
          - type: tile
            features_position: bottom
            vertical: false
            entity: binary_sensor.quiss_server_local
          - type: tile
            features_position: bottom
            vertical: false
            entity: binary_sensor.msi_host_local
    header:
      card:
        type: markdown
        content: '# Devices'
    visible:
      - user: d35ec065e1c14502924b0822b389c5c3
    cards: []
    badges:
      - type: entity
        entity: sensor.uptime
